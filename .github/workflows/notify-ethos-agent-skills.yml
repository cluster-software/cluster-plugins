name: Notify Ethos Agent Skills

on:
  push:
    branches:
      - main
    paths:
      - "plugins/ethos-gtm/skills/**"
  workflow_dispatch:

permissions: {}

jobs:
  notify-ethos:
    name: Dispatch canonical skill update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check sync configuration
        id: configuration
        env:
          APP_ID: ${{ secrets.ETHOS_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ETHOS_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ethos sync App secrets are not configured; the Ethos scheduled poll remains the fallback."
          fi

      - name: Create Ethos-only App token
        if: steps.configuration.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ETHOS_SYNC_APP_ID }}
          private-key: ${{ secrets.ETHOS_SYNC_APP_PRIVATE_KEY }}
          owner: cluster-software
          repositories: ethos
          permission-contents: write

      - name: Notify Ethos
        if: steps.configuration.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST repos/cluster-software/ethos/dispatches \
            -f event_type=agent-skills-updated \
            -f "client_payload[source_repository]=$SOURCE_REPOSITORY" \
            -f "client_payload[source_commit]=$SOURCE_COMMIT" \
            -f "client_payload[source_ref]=$SOURCE_REF"
          echo "::notice::Notified Ethos of canonical skill commit $SOURCE_COMMIT."
